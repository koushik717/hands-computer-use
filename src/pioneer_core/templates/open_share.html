<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>Open New Share</title>
  <link rel="stylesheet" href="/static/legacy.css">
</head>
<body>
<div class="panel">
  <p class="ttl">Open New Share — File Maintenance</p>
  <p>Account base {{ member.member_id }}</p>
  {% if error %}<p><font color="red">{{ error }}</font></p>{% endif %}
  <form method="post" action="/cgi/open.asp">
    <input type="hidden" name="__VIEWSTATE" value="{{ viewstate }}">
    <input type="hidden" name="member_id" value="{{ member.member_id }}">
    <input type="hidden" name="inst" value="{{ inst }}">
    <table border="0" cellpadding="4">
      <tr>
        <td>Product type:</td>
        <td>
          <select name="product">
            <option value="">-- select --</option>
            <option value="regular_share">Regular Share</option>
            <option value="money_market">Money Market Share</option>
            <option value="certificate">Share Certificate</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Nickname:</td>
        <td><input type="text" name="nickname" size="20"></td>
      </tr>
      <tr>
        <td>Initial deposit:</td>
        <td><input type="text" name="deposit" size="10"></td>
      </tr>
      <tr>
        <td></td>
        <td><input type="submit" name="btnNext" value="Review"></td>
      </tr>
    </table>
  </form>
  <p><a href="/cgi/member.asp?id={{ member.member_id }}&amp;inst={{ inst }}">Cancel</a></p>
</div>
</body>
</html>
