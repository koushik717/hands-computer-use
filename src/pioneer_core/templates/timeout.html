<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>Session expired</title>
  <link rel="stylesheet" href="/static/legacy.css">
</head>
<body>
<div class="notice">
  <p><b>Your teller session has expired.</b></p>
  <p>Re-authentication is required. Hands will not type credentials.</p>
  <form method="post" action="/cgi/session.asp">
    <input type="hidden" name="inst" value="{{ inst }}">
    <input type="hidden" name="action" value="continue">
    <input type="submit" value="Return to login">
  </form>
</div>
</body>
</html>
