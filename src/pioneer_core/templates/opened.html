<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>Share opened</title>
  <link rel="stylesheet" href="/static/legacy.css">
</head>
<body>
<div class="panel">
  <p class="ttl">Share opened</p>
  <p>Confirmation reference <b>{{ reference }}</b></p>
  <table border="0" cellpadding="4">
    <tr><td>Member</td><td>{{ member_id }}</td></tr>
    <tr><td>Product</td><td>{{ product }}</td></tr>
    <tr><td>Nickname</td><td>{{ nickname }}</td></tr>
    <tr><td>Initial deposit</td><td>{{ deposit }}</td></tr>
  </table>
  <p><a href="/cgi/member.asp?id={{ member_id }}&amp;inst={{ inst }}">Back to Share Inquiry</a></p>
</div>
</body>
</html>
