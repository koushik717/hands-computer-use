<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>Member Inquiry</title>
  <link rel="stylesheet" href="/static/legacy.css">
</head>
<body>
<div class="panel">
  <form method="post" action="/cgi/search.asp" name="frmInq">
    <input type="hidden" name="__VIEWSTATE" value="{{ viewstate }}">
    <input type="hidden" name="inst" value="{{ inst }}">
    <table border="0" cellpadding="3" cellspacing="0">
      <tr><td colspan="2" class="ttl">Member Inquiry</td></tr>
      <tr>
        <td nowrap>{{ member_label }}:</td>
        <td><input type="text" name="txtMemNo" size="12" maxlength="12" value="{{ q or '' }}"></td>
      </tr>
      <tr>
        <td></td>
        <td><input type="submit" name="btnInq" value="{{ search_label }}"></td>
      </tr>
    </table>
  </form>

  {% if error %}
  <p><font color="red">{{ error }}</font></p>
  {% endif %}

  {% if results %}
  <p class="ttl">Search Results</p>
  <table class="grid" border="1" cellspacing="0" cellpadding="3">
    <tr>
      <th>Member #</th>
      <th>Name</th>
      <th>Status</th>
    </tr>
    {% for m in results %}
    <tr>
      <td><a href="/cgi/member.asp?id={{ m.member_id }}&amp;inst={{ inst }}">{{ m.member_id }}</a></td>
      <td>{{ m.display_name }}</td>
      <td>{{ m.status }}</td>
    </tr>
    {% endfor %}
  </table>
  {% endif %}
</div>
</body>
</html>
