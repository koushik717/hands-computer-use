<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
  <title>Confirm Open Share</title>
  <link rel="stylesheet" href="/static/legacy.css">
</head>
<body>
<div class="panel">
  <p class="ttl">Confirm Open Share</p>
  <p>This posts a new share to the membership. It is not reversible from this screen.</p>
  <table border="0" cellpadding="4">
    <tr><td>Member</td><td>{{ member.member_id }}</td></tr>
    <tr><td>Product</td><td>{{ product }}</td></tr>
    <tr><td>Nickname</td><td>{{ nickname }}</td></tr>
    <tr><td>Initial deposit</td><td>{{ deposit }}</td></tr>
  </table>
  <form method="post" action="/cgi/open_commit.asp">
    <input type="hidden" name="member_id" value="{{ member.member_id }}">
    <input type="hidden" name="product" value="{{ product }}">
    <input type="hidden" name="nickname" value="{{ nickname }}">
    <input type="hidden" name="deposit" value="{{ deposit }}">
    <input type="hidden" name="inst" value="{{ inst }}">
    <p>
      <input type="submit" name="btnCommit" value="Confirm Open Share">
    </p>
  </form>
  <p><a href="/cgi/open.asp?id={{ member.member_id }}&amp;inst={{ inst }}">Back</a></p>
</div>
</body>
</html>
